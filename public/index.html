<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8003c" />
    <meta name="description" content="Saan Nize — Video Editor &amp; Motion Designer. Cinematic storytelling, bilingual portfolio (EN/日本語). Available for work in Japan." />
    <meta name="keywords" content="video editor, motion designer, Japan, bilingual, Saan Nize, portfolio, After Effects, Premiere Pro, DaVinci Resolve" />
    <meta property="og:title" content="Saan Nize | Video Editor · Motion Designer" />
    <meta property="og:description" content="Cinematic video editing &amp; motion design. Bilingual portfolio — English &amp; 日本語." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saannize.github.io/portfolio" />

    <!-- Preload critical assets -->
    <link rel="preload" href="%PUBLIC_URL%/favicon.svg" as="image" type="image/svg+xml" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts: Bebas Neue + Inter + Share Tech Mono + Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Flash prevention: read theme + lang from localStorage BEFORE React mounts -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('saan-theme') || 'phantom';
          var lang  = localStorage.getItem('saan-lang')  || 'en';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('lang', lang === 'ja' ? 'ja' : 'en');
        } catch (e) {}

        /* prefers-color-scheme fallback if no stored theme */
        try {
          if (!localStorage.getItem('saan-theme')) {
            var mq = window.matchMedia('(prefers-color-scheme: light)');
            if (mq && mq.matches) {
              document.documentElement.setAttribute('data-theme', 'sakura');
            }
          }
        } catch (e) {}
      })();
    </script>

    <title>Saan Nize | Video Editor · Motion Designer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      GitHub Pages SPA redirect handled by 404.html + this script.
      See: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </body>
</html>
